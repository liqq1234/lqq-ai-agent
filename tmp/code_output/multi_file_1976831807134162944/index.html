<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户登录</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h1>欢迎登录</h1>
      </div>
      <div class="card-body">
        <div id="successMessage" class="message success">登录成功！正在进入主页...</div>
        <div id="errorMessage" class="message error">用户名或密码错误，请重试。</div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" required />
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码" required />
          </div>
          <div class="remember-me">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">记住我</label>
          </div>
          <button type="submit" class="btn-primary">立即登录</button>
        </form>

        <div class="links">
          <a href="#">忘记密码？</a>
          <a href="#">注册账户</a>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
